<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="800" height="320" fill="#fff"/>
<text x="30" y="30" font-size="16" font-weight="700" fill="#1E293B">Volumetric weight in three steps</text>
<polygon points="70,110 190,110 230,80 110,80" fill="#FDE68A" stroke="#1E293B"/><rect x="70" y="110" width="120" height="100" fill="#FCD34D" stroke="#1E293B"/><polygon points="190,110 230,80 230,180 190,210" fill="#F59E0B" stroke="#1E293B"/>
<text x="130" y="232" font-size="12" text-anchor="middle" fill="#1E293B">L 60 cm</text><text x="240" y="150" font-size="12" fill="#1E293B">H 40 cm</text><text x="95" y="68" font-size="12" fill="#1E293B">W 50 cm</text>
<text x="30" y="270" font-size="12" fill="#64748B">One carton</text>
<rect x="310" y="90" width="140" height="110" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="380" y="118" font-size="12" text-anchor="middle" fill="#64748B">Step 1</text><text x="380" y="145" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">L × W × H</text><text x="380" y="170" font-size="13" text-anchor="middle" fill="#1E293B">60×50×40</text><text x="380" y="190" font-size="13" text-anchor="middle" fill="#1E293B">= 120,000 cm³</text>
<rect x="470" y="90" width="140" height="110" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="540" y="118" font-size="12" text-anchor="middle" fill="#64748B">Step 2</text><text x="540" y="145" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">÷ 6,000</text><text x="540" y="172" font-size="13" text-anchor="middle" fill="#1E293B">= 20 kg</text><text x="540" y="190" font-size="11" text-anchor="middle" fill="#64748B">per carton</text>
<rect x="630" y="90" width="140" height="110" rx="8" fill="#CCFBF1" stroke="#0F766E"/><text x="700" y="118" font-size="12" text-anchor="middle" fill="#64748B">Step 3</text><text x="700" y="145" font-size="14" font-weight="700" text-anchor="middle" fill="#1E293B">Compare</text><text x="700" y="170" font-size="12" text-anchor="middle" fill="#1E293B">actual vs volumetric</text><text x="700" y="190" font-size="12" text-anchor="middle" fill="#1E293B">bigger one wins</text>
<text x="400" y="270" font-size="13" text-anchor="middle" fill="#1E293B">4 cartons × 20 kg = 80 kg volumetric, versus 30 kg on the scale → billed as 80 kg</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
