<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- sky backdrop -->
  <rect x="0" y="0" width="900" height="340" fill="none"/>

  <!-- flight path dashes -->
  <path d="M40 70 Q 300 20 620 60" stroke="#F5A623" stroke-width="2.5" stroke-dasharray="2 12" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- cargo plane -->
  <g transform="translate(560,40) rotate(8)">
    <path d="M0 30 L150 30 L175 20 L190 22 L175 32 L150 40 L0 40 Z" fill="#0E1626"/>
    <path d="M60 30 L20 -10 L45 -10 L95 30 Z" fill="#0E1626"/>
    <path d="M60 40 L20 70 L45 70 L95 40 Z" fill="#0E1626"/>
    <path d="M150 30 L165 8 L178 10 L168 32 Z" fill="#0E1626"/>
    <circle cx="185" cy="24" r="3" fill="#F5A623"/>
    <rect x="70" y="32" width="34" height="6" rx="2" fill="#F5A623"/>
  </g>

  <!-- ground line -->
  <line x1="0" y1="300" x2="900" y2="300" stroke="#D7DCE3" stroke-width="2"/>

  <!-- warehouse building -->
  <g>
    <rect x="70" y="180" width="340" height="120" fill="#12203A"/>
    <polygon points="70,180 240,110 410,180" fill="#0E1626"/>
    <rect x="95" y="215" width="50" height="85" fill="#F5A623"/>
    <rect x="165" y="220" width="34" height="34" fill="#3A4A68"/>
    <rect x="215" y="220" width="34" height="34" fill="#3A4A68"/>
    <rect x="265" y="220" width="34" height="34" fill="#3A4A68"/>
    <rect x="315" y="220" width="34" height="34" fill="#3A4A68"/>
    <rect x="230" y="100" width="20" height="14" fill="#0E1626"/>
    <rect x="360" y="260" width="30" height="40" fill="#3A4A68"/>
  </g>

  <!-- stacked crates -->
  <g>
    <rect x="440" y="240" width="60" height="60" fill="#F5A623"/>
    <line x1="440" y1="270" x2="500" y2="270" stroke="#0E1626" stroke-width="2"/>
    <line x1="470" y1="240" x2="470" y2="300" stroke="#0E1626" stroke-width="2"/>

    <rect x="505" y="255" width="50" height="45" fill="#0E7C86"/>
    <line x1="505" y1="277" x2="555" y2="277" stroke="#0E1626" stroke-width="2"/>

    <rect x="440" y="190" width="60" height="45" fill="#12203A"/>
    <line x1="440" y1="212" x2="500" y2="212" stroke="#F5A623" stroke-width="2"/>
  </g>

  <!-- forklift (simplified) -->
  <g transform="translate(600,255)">
    <rect x="0" y="20" width="55" height="24" rx="3" fill="#F5A623"/>
    <rect x="10" y="0" width="30" height="22" fill="#0E1626"/>
    <circle cx="12" cy="46" r="9" fill="#0E1626"/>
    <circle cx="45" cy="46" r="9" fill="#0E1626"/>
    <rect x="52" y="-10" width="6" height="42" fill="#3A4A68"/>
    <rect x="52" y="6" width="20" height="6" fill="#3A4A68"/>
  </g>

  <!-- shipping containers row far right -->
  <g>
    <rect x="700" y="235" width="90" height="65" fill="#0E7C86"/>
    <rect x="700" y="235" width="90" height="65" fill="none" stroke="#0A5C64" stroke-width="1"/>
    <rect x="795" y="250" width="80" height="50" fill="#F5A623"/>
    <rect x="795" y="250" width="80" height="50" fill="none" stroke="#C97F0D" stroke-width="1"/>
  </g>
</svg>
